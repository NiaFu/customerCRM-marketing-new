services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/crm
      DB_USER: crm
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CRM_ADMIN_USERNAME: ${CRM_ADMIN_USERNAME:?Set CRM_ADMIN_USERNAME in .env}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:?Set CRM_ADMIN_PASSWORD in .env}
      SMS_MODE: ${SMS_MODE:-preview}
      CLICKSEND_USERNAME: ${CLICKSEND_USERNAME:-}
      CLICKSEND_API_KEY: ${CLICKSEND_API_KEY:-}
      SMS_FROM: ${SMS_FROM:-}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on: [backend]
volumes:
  crm_postgres:
