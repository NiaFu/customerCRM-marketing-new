name: CRM MVP CI
on:
  push:
    branches: [main, feat/initial-crm-mvp]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  api-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Start API against PostgreSQL
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/crm
          DB_USER: crm
          DB_PASSWORD: test_password
          CRM_ADMIN_USERNAME: admin
          CRM_ADMIN_PASSWORD: ci_only_example_password_123
          SMS_MODE: preview
        run: |
          nohup mvn -B -q spring-boot:run > "$RUNNER_TEMP/crm.log" 2>&1 &
          for i in {1..90}; do
            if curl -fsS -u admin:ci_only_example_password_123 http://localhost:8080/api/me > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/crm.log"
          exit 1
      - name: Test customers, tags, pipeline, consent and SMS preview
        env:
          CRM_ADMIN_USERNAME: admin
          CRM_ADMIN_PASSWORD: ci_only_example_password_123
        run: bash backend/scripts/smoke.sh
